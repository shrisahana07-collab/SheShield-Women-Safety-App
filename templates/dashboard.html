<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SheShield Emergency Dashboard</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            padding: 20px;
        }

        header {
            background-color: #d9534f;
            color: white;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-badge {
            background-color: #ffc107;
            color: #000;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .status-badge.active {
            background-color: #dc3545;
            color: white;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .grid-container {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .card h2 {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: #444;
            border-bottom: 2px solid #eee;
            padding-bottom: 8px;
        }

        #map {
            height: 350px;
            width: 100%;
            border-radius: 8px;
        }

        .image-container {
            width: 100%;
            height: 350px;
            background-color: #e9ecef;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .no-image {
            color: #6c757d;
            font-style: italic;
        }

        .btn-container {
            margin-top: 20px;
            display: flex;
            gap: 15px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-sos {
            background-color: #dc3545;
            color: white;
        }

        .btn-sos:hover {
            background-color: #c82333;
        }

        .btn-reset {
            background-color: #6c757d;
            color: white;
        }

        .btn-reset:hover {
            background-color: #5a6268;
        }
    </style>
</head>
<body>

    <header>
        <h1>SheShield Dashboard</h1>
        <span id="statusBadge" class="status-badge">SYSTEM NORMAL</span>
    </header>

    <div class="grid-container">
        <!-- Live Map Section -->
        <div class="card">
            <h2>Live Victim Location</h2>
            <div id="map"></div>
        </div>

        <!-- Camera Evidence Section -->
        <div class="card">
            <h2>Captured Scene Evidence (ESP32-CAM)</h2>
            <div class="image-container">
                <img id="cameraFeed" src="" alt="Captured Evidence Frame" style="display: none;">
                <span id="noImageText" class="no-image">Waiting for image evidence capture...</span>
            </div>
        </div>
    </div>

    <div class="btn-container">
        <button class="btn-sos" onclick="triggerManualSOS()">Trigger Manual SOS</button>
        <button class="btn-reset" onclick="resetSOS()">Reset Alarm State</button>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // Initialize Leaflet Map (Default position: Chennai)
        let map = L.map('map').setView([13.0827, 80.2707], 14);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        let marker = L.marker([13.0827, 80.2707]).addTo(map)
            .bindPopup('<b>Victim Location</b>')
            .openPopup();

        // Function to update status, map position, and photo evidence
        function pollStatus() {
            fetch('/get_latest_status')
                .then(response => response.json())
                .then(data => {
                    // Update Status Badge
                    const badge = document.getElementById('statusBadge');
                    if (data.sos_active) {
                        badge.innerText = "EMERGENCY SOS ACTIVATED!";
                        badge.classList.add('active');
                    } else {
                        badge.innerText = "SYSTEM NORMAL";
                        badge.classList.remove('active');
                    }

                    // Update Map Location
                    if (data.location && data.location.lat && data.location.lng) {
                        const lat = data.location.lat;
                        const lng = data.location.lng;
                        marker.setLatLng([lat, lng]);
                        map.panTo([lat, lng]);
                    }

                    // Update Camera Image Frame
                    const imgElement = document.getElementById('cameraFeed');
                    const noImageText = document.getElementById('noImageText');

                    if (data.image_url) {
                        // Append cache-busting timestamp so browser reloads newest image
                        imgElement.src = data.image_url + '?t=' + new Date().getTime();
                        imgElement.style.display = 'block';
                        noImageText.style.display = 'none';
                    } else {
                        imgElement.style.display = 'none';
                        noImageText.style.display = 'block';
                    }
                })
                .catch(err => console.error("Error polling status:", err));
        }

        // Trigger Manual SOS via button
        function triggerManualSOS() {
            fetch('/trigger_sos', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: 'User', phone: 'Emergency Trigger' })
            }).then(() => pollStatus());
        }

        // Reset SOS state
        function resetSOS() {
            fetch('/reset_sos', { method: 'POST' })
                .then(() => pollStatus());
        }

        // Auto-poll status every 3 seconds
        setInterval(pollStatus, 3000);
        pollStatus(); // Initial fetch
    </script>
</body>
</html>
